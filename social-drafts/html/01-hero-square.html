*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{
  background:#0A0A0B;
  font-family:'InterLocal',-apple-system,'SF Pro Display',system-ui,sans-serif;
  color:#F5F4EF;
  -webkit-font-smoothing:antialiased;
}
/* Ambient brand glow — keeps the flat dark background from reading as empty. */
body::before{content:'';position:absolute;inset:0;
  background:
    radial-gradient(90% 60% at 12% 0%, #34D3991F 0%, transparent 60%),
    radial-gradient(80% 55% at 100% 100%, #22D3EE1A 0%, transparent 62%);}
body::after{content:'';position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(#25252A 1px,transparent 1px),linear-gradient(90deg,#25252A 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 78%);}
.pad{position:relative;z-index:1;width:100%;height:100%;padding:72px;display:flex}
.col{flex-direction:column}
.row{flex-direction:row}
.center{align-items:center;text-align:center;justify-content:center}
.grow{flex:1}
.between{justify-content:space-between;align-items:center;display:flex;width:100%}
.mt{margin-top:44px}.mt2{margin-top:18px}.mt3{margin-top:26px}

.lockup{display:flex;align-items:center;gap:18px}
.mark{width:86px;height:86px;border-radius:20px;display:block}
.word{font-size:38px;font-weight:700;letter-spacing:-0.02em}

h1{font-size:96px;line-height:1.03;font-weight:800;
   letter-spacing:-0.035em;margin-top:28px;
   background:linear-gradient(105deg,#F5F4EF 30%,#34D399 78%,#22D3EE 100%);
   -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{font-size:34px;line-height:1.38;color:#88868A;margin-top:26px;max-width:86%;font-weight:400}
.center .sub{margin-left:auto;margin-right:auto}

.footer{margin-top:40px;width:100%}
.center .footer{margin-top:52px}
.cta{display:inline-block;font-size:30px;font-weight:700;color:#0A0A0B;
  background:linear-gradient(100deg,#34D399,#22D3EE);
  padding:20px 38px;border-radius:999px;letter-spacing:-0.01em}
.disc{margin-top:20px;font-size:21px;color:#6E6D72;letter-spacing:0.01em;font-weight:600}

.spark{margin-top:40px;opacity:.95}
.chip{display:inline-block;font-size:24px;font-weight:700;padding:10px 20px;border-radius:999px}
.chip.up{color:#2BF06A;background:#2BF06A1F}
.tick{font-size:20px;font-weight:700;letter-spacing:.14em;color:#88868A;text-transform:uppercase}

.chartcard,.statcard,.board{background:#141416;border:1px solid #25252A;border-radius:34px;padding:40px}
.chartcard{margin-top:52px}
.price{font-size:52px;font-weight:800;letter-spacing:-0.025em;margin-top:6px;font-variant-numeric:tabular-nums}
.note{margin-top:22px;font-size:21px;color:#6E6D72}
.big{font-size:92px;font-weight:800;letter-spacing:-0.035em;margin-top:10px;font-variant-numeric:tabular-nums}
.med{font-size:34px;font-weight:700;margin-top:6px}
.rowsplit{display:flex;gap:34px;margin-top:34px;border-top:1px solid #25252A;padding-top:28px}

.split{gap:64px}
.left{flex:1.05;justify-content:center}
.right{flex:1;justify-content:center;display:flex}
.statcard{width:100%}

.board{margin-top:46px;padding:12px 18px}
.brow{display:flex;align-items:center;gap:22px;padding:26px 22px;border-bottom:1px solid #25252A}
.brow:last-child{border-bottom:none}
.brow.me{background:#34D39914;border-radius:20px}
.rank{font-size:30px;font-weight:800;color:#88868A;width:44px;font-variant-numeric:tabular-nums}
.who{font-size:32px;font-weight:700;flex:1}
.league{font-size:24px;font-weight:600;color:#88868A}
.pct{font-size:32px;font-weight:800;width:140px;text-align:right;font-variant-numeric:tabular-nums}
.pct.up{color:#2BF06A}

.seal{width:300px;height:300px;border-radius:50%;margin:52px auto 10px;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(from 200deg,#34D399,#22D3EE,#34D399);padding:5px}
.sealinner{width:100%;height:100%;border-radius:50%;background:#111113;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.sealnum{font-size:104px;font-weight:800;letter-spacing:-0.04em;
  background:linear-gradient(120deg,#34D399,#22D3EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sealtxt{font-size:23px;font-weight:700;letter-spacing:.2em;color:#88868A}
