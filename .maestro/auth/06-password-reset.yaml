appId: com.simpledesignllc.cryptocomp
tags:
  - full
---
# Full: the forgot-password flow is reachable and asks for a code.
#
# Stops short of completing a reset: that needs a real code from a real inbox,
# which Maestro can't read. What this covers is the part that regressed before —
# the entry point existing at all, the two steps wiring up, and the response to
# an unknown address staying enumeration-safe.
- launchApp
- tapOn:
    text: "Profile"      # tab bar label
- tapOn: { id: "authwall-signin-btn" }
- assertVisible: { id: "auth-username-input" }

# The link is sign-in only — it should be here on the sign-in view.
- assertVisible: { id: "auth-forgot-link" }
- tapOn: { id: "auth-forgot-link" }

# Step 1: email entry.
- assertVisible: { id: "auth-reset-email-input" }
- assertVisible: { id: "auth-reset-send-btn" }
- tapOn: { id: "auth-reset-email-input" }
- inputText: "no-such-user-${Math.random().toString(36).slice(2, 6)}@example.com"
- tapOn: { id: "auth-reset-send-btn" }

# An unregistered address must NOT be revealed as unregistered — the copy is
# deliberately conditional ("If <email> is registered..."), so the flow advances
# to the code step exactly as it would for a real account.
- assertVisible:
    text: "Check your email"
- tapOn:
    text: "OK"

# Step 2: code + new password.
- assertVisible: { id: "auth-reset-code-input" }
- assertVisible: { id: "auth-reset-newpw-input" }
- assertVisible: { id: "auth-reset-confirm-btn" }

# The new password is held to the same policy as sign-up.
- tapOn: { id: "auth-reset-code-input" }
- inputText: "123456"
- tapOn: { id: "auth-reset-newpw-input" }
- inputText: "weak"
- tapOn: { id: "auth-reset-confirm-btn" }
- assertVisible:
    text: "Choose a stronger password"
- tapOn:
    text: "OK"

# Cancel returns to sign in.
- tapOn: { id: "auth-reset-cancel-btn" }
- assertVisible: { id: "auth-username-input" }
- assertVisible: { id: "auth-submit-btn" }
